name: Carte d'activité

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/activite.py"
      - ".github/workflows/activite.yml"

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer la carte
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python .github/scripts/activite.py
      - name: Publier si elle a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuels/activite-*.svg
          git diff --cached --quiet || (git commit -m "Mise à jour de la carte d'activité" && git push)
